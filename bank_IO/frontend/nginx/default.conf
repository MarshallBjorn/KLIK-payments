# Mock-bank UI — statyk SPA. Backend wołany z przeglądarki po URL-u z konfigu
# (localStorage), więc bez reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (vue-router createWebHistory).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
