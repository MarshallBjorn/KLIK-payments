services:
  db:
    image: postgres:15
    volumes:
      - ./db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - klik_net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - klik_net

  web:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - klik_net

  worker:
    build: ./backend
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - klik_net

  beat:
    build: ./backend
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - klik_net

  rtgs-mock:
    build: ./rtgs_mock
    environment:
      RTGS_LATENCY_MIN_MS: ${RTGS_LATENCY_MIN_MS:-50}
      RTGS_LATENCY_MAX_MS: ${RTGS_LATENCY_MAX_MS:-300}
      RTGS_FAIL_RATE: ${RTGS_FAIL_RATE:-0.0}
      RTGS_TIMEOUT_RATE: ${RTGS_TIMEOUT_RATE:-0.0}
      RTGS_BLACKLIST: ${RTGS_BLACKLIST:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - klik_net

  bank-mock-backend:
    build: ./bank_IO/backend
    environment:
      BANK_NAME: ${BANK_MOCK_NAME:-BANK_MOCK}
      BANK_ZONE: ${BANK_MOCK_ZONE:-PL}
      # KLIK: w sieci compose serwis nazywa się "web" (port 8000)
      KLIK_BASE_URL: ${BANK_MOCK_KLIK_BASE_URL:-http://web:8000/api/v1}
      KLIK_BANK_API_KEY: ${BANK_MOCK_KLIK_BANK_API_KEY:-}
      KLIK_CODE_TTL_SECONDS: ${KLIK_CODE_TTL_SECONDS:-120}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - klik_net

  bank-mock-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_ALLOWED_HOSTS: ${BANK_MOCK_FRONTEND_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./bank_IO/frontend:/app
    depends_on:
      - bank-mock-backend
    networks:
      - klik_net

  agent:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Vite proxy z UI agenta → Django API. Lokalnie: serwis `web` w sieci compose.
      # W split-prod (agent osobno od KLIK) ustaw publiczny URL, np. https://klik.user.com
      VITE_PROXY_TARGET: ${AGENT_VITE_PROXY_TARGET:-http://web:8000}
      VITE_ALLOWED_HOSTS: ${AGENT_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./agent:/app
    depends_on:
      - web
    networks:
      - klik_net

networks:
  klik_net:
    driver: bridge
